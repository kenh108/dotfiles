set -g renumber-windows on
set -g history-limit 100000
set -as terminal-features ",xterm-256color:RGB"
set -s set-clipboard on
set -g allow-passthrough on # For SSH clipboard passthrough
set -g mouse off

# For newer versions
%if #{>=:#{version},3.8}
set -s theme terminal
%endif

# For older versions
%if #{<=:#{version},3.8}
set -g default-terminal "tmux-256color"
set -sg escape-time 10
%endif

# Reload config
bind S source-file ~/.config/tmux/tmux.conf \; display-message "Sourced ~/.config/tmux/tmux.conf"

# New prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Window split keybinds
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Vim-style pane resizing
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5  
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Vim-style window navigation
bind -n M-h previous-window
bind -n M-l next-window

# Vim-style copying
setw -g mode-keys vi
unbind -T copy-mode-vi C-j # Conflicts with pane movement
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe

# Refresh shortcuts
bind r confirm-before -p "Refresh window? (y/n)" "new-window -a -t . \; kill-window -t !"
bind R confirm-before -p "Refresh session? (y/n)" "kill-window -a"

# Command shortcuts
# unbind -n t
# bind t send-keys "btop" Enter

# Style
color1="#383838"
color2="#5c5c5c"
color3="#909090"
color4="#aeaeae"
color5="#eeeeee"
set -g status-style "fg=${color4},bg=default"
# set -g status-style "fg=7,bg=default"
set -g pane-border-style "fg=${color1}"
# set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=${color4}"
# set -g pane-active-border-style "fg=7"
set -g status-left-length 25
set -g window-status-format "#W"
set -g window-status-current-format "(#W)"
