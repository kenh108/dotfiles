add_newline = false
format = "$all$fill$cmd_duration$line_break$character"

[fill]
symbol = ' '

[time]
disabled = true
time_format = '%T, %d/%m/%y'

[directory]
truncation_length = 0
format = "[$path]($style)[$read_only]($read_only_style) "
