# Reset keys to default
unbind -a
source-file ~/.tmux_reset.conf

set -g history-limit 100000
set -sg escape-time 0
set -g mode-keys vi
# Allow OSC 52 sequences to pass through tmux
set -g allow-passthrough on
set -g set-clipboard on

unbind S 
bind S source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

unbind C-b
set -g prefix C-Space
unbind v
unbind %
bind v split-window -h -c "#{pane_current_path}"
unbind o
unbind '"'
bind o split-window -v -c "#{pane_current_path}"
unbind n
bind n command-prompt "rename-window '%%'"
unbind w
bind w new-window -a

# Window navigation (Alt+{h/l})
bind -n M-h previous-window
bind -n M-l next-window

# Pane navigation (Ctrl+{h/j/k/l})
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
# Override copy-mode-vi default behaviour
unbind -T copy-mode-vi C-h
bind -T copy-mode-vi C-h select-pane -L

unbind r
bind r confirm-before -p "refresh-window #W? (y/n)" "new-window -a -t . \; kill-window -t !"
unbind R
bind R confirm-before -p "refresh-session #W? (y/n)" "kill-window -a"

unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi C-j # Conflicts with pane movement
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe

# Vim keybindings to resize pane, 
set-option -g repeat-time 1000
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5  
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
# Allow auto-repeat (hold key down continuously)
set-option -g xterm-keys on

# command shortcuts
unbind -n t
bind t send-keys "btop" Enter
unbind -n g
bind g send-keys "nvtop" Enter

# Visual settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
%if #{>=:#{version},3.8}
set -s theme terminal
%endif
set -g status-style "fg=grey"
set -g pane-border-style "fg=grey"
set -g status-left-length 25
# Disable numbering of windows
set -g renumber-windows on
set -g window-status-format "#W"
set -g window-status-current-format "(#W)"

# Initialise tmux plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
